on:
  push:
    paths: ['**.Rmd']
  workflow_dispatch:

name: render-manuscript

permissions:
  contents: write

jobs:
  render-rmarkdown:
    runs-on: macos-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("rmarkdown", "papaja", "tidyverse", "patchwork", "jsonlite", "dplyr", "readr", "tidyr", "ggplot2", "stringr", "lmerTest", "afex", "forcats", "broom.mixed"))'
      - name: Render manuscript
        run: |
          Rscript -e 'rmarkdown::render("manuscript.Rmd")'
      - name: Upload rendered PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manuscript
          path: manuscript.pdf
